.iso{
  --anatomy-page:#0b0b0b;--anatomy-card:#131313;--anatomy-text:#a3a3a3;--anatomy-strong:#e6e6e6;--anatomy-muted:#6e6e6e;
  --anatomy-paper:#131313;--anatomy-face:#1b1b1b;--anatomy-top:#1c1c1c;
  --anatomy-shade-0:#0f0f0f;--anatomy-shade-1:#121212;--anatomy-shade-2:#151515;--anatomy-shade-3:#181818;
  --anatomy-lit-top:#262626;--anatomy-lit-shade:#1d1d1d;
  --anatomy-hi:#d4d4d4;--anatomy-mid:#6a6a6a;--anatomy-lo:#3e3e3e;--anatomy-faint:#2a2a2a;--anatomy-lit:#ffffff;
  --anatomy-halo:#050505;--anatomy-halo-opacity:.9;--anatomy-dot:#e6e6e6;
  --anatomy-red:#ff6b6b;--anatomy-green:#6be0a0;--anatomy-blue:#6b9bff;
  --anatomy-weight:.6px;--anatomy-ease:cubic-bezier(.32,.72,0,1);
  --anatomy-mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --anatomy-lift:inset 0 1px 0 0 #ffffff0a,inset 0 0 0 1px #ffffff06,0 0 0 1px #00000026,0 1px 1px -.5px #00000014,0 3px 3px -1.5px #00000014,0 6px 6px -3px #00000014,0 12px 12px -6px #00000014;
}
.iso[data-theme="light"]{
  --anatomy-page:#ffffff;--anatomy-card:#f2f0ed;--anatomy-text:#322c2b;--anatomy-strong:#231e1d;--anatomy-muted:#6f6765;
  --anatomy-paper:#f2f0ed;--anatomy-face:#ffffff;--anatomy-top:#ffffff;
  --dm-red:#8b1e20;--dm-red-dark:#551112;--dm-red-tint:#fae6e5;--dm-rule:#d8d3d2;--dm-plate-edge:#c1bdba;
  --anatomy-shade-0:#dcdcd9;--anatomy-shade-1:#e5e5e2;--anatomy-shade-2:#ededea;--anatomy-shade-3:#f4f4f1;
  --anatomy-lit-top:#ffffff;--anatomy-lit-shade:#eeeeeb;
  --anatomy-hi:#26262a;--anatomy-mid:#8a8a8f;--anatomy-lo:#b4b4b8;--anatomy-faint:#d4d4d6;--anatomy-lit:#000000;
  --anatomy-halo:#8a8a80;--anatomy-halo-opacity:.32;--anatomy-dot:#3a3a3e;
  --anatomy-red:#e5484d;--anatomy-green:#30a46c;--anatomy-blue:#3e63dd;
  --anatomy-lift:inset 0 1px 0 0 #ffffff,0 0 0 1px #0000000f,0 1px 1px -.5px #0000000a,0 3px 3px -1.5px #0000000a,0 6px 6px -3px #0000000a,0 12px 12px -6px #0000000a;
}
.iso-svg{display:block;width:100%;height:auto;overflow:visible}
.iso-svg path,.iso-svg circle{vector-effect:non-scaling-stroke}
.iso-fill{fill:var(--anatomy-paper);stroke:none}
.iso-solid[data-lit]>.iso-fill{fill:var(--anatomy-face)}
.iso-shade,.iso-top{stroke:none}
.iso-shade[data-shade="0"]{fill:var(--anatomy-shade-0)}
.iso-shade[data-shade="1"]{fill:var(--anatomy-shade-1)}
.iso-shade[data-shade="2"]{fill:var(--anatomy-shade-2)}
.iso-shade[data-shade="3"]{fill:var(--anatomy-shade-3)}
.iso-top{fill:var(--anatomy-top)}
.iso-solid[data-lit]>.iso-top{fill:var(--anatomy-lit-top)}
.iso-solid[data-lit]>.iso-shade{fill:var(--anatomy-lit-shade)}
.iso-solid[data-seamless]>.iso-shade,.iso-solid[data-seamless]>.iso-top{stroke-width:.4;stroke-linejoin:round}
.iso-solid[data-seamless]>.iso-shade[data-shade="0"]{stroke:var(--anatomy-shade-0)}
.iso-solid[data-seamless]>.iso-shade[data-shade="1"]{stroke:var(--anatomy-shade-1)}
.iso-solid[data-seamless]>.iso-shade[data-shade="2"]{stroke:var(--anatomy-shade-2)}
.iso-solid[data-seamless]>.iso-shade[data-shade="3"]{stroke:var(--anatomy-shade-3)}
.iso-solid[data-seamless]>.iso-top{stroke:var(--anatomy-top)}
.iso-solid[data-seamless][data-lit]>.iso-top{stroke:var(--anatomy-lit-top)}
.iso-solid[data-seamless][data-lit]>.iso-shade{stroke:var(--anatomy-lit-shade)}
.iso-solid[data-lit]>.iso-edge{stroke:var(--anatomy-lit)}
.iso-halo{fill:var(--anatomy-halo);stroke:none;filter:blur(9px);opacity:var(--anatomy-halo-opacity);transform:translateY(3px)}
.iso-line{fill:none;stroke:var(--anatomy-lo);stroke-width:var(--anatomy-weight);stroke-linecap:round;stroke-linejoin:round}
.iso-line[data-tone="hi"]{stroke:var(--anatomy-hi)}
.iso-line[data-tone="mid"]{stroke:var(--anatomy-mid)}
.iso-line[data-tone="lo"]{stroke:var(--anatomy-lo)}
.iso-line[data-tone="faint"]{stroke:var(--anatomy-faint)}
.iso-line[data-tone="lit"]{stroke:var(--anatomy-lit)}
.iso-line[data-tone="red"]{stroke:var(--anatomy-red)}
.iso-line[data-tone="green"]{stroke:var(--anatomy-green)}
.iso-line[data-tone="blue"]{stroke:var(--anatomy-blue)}
.iso-line[data-dotted]{stroke-dasharray:.01 3.5;stroke-width:1}
.iso-line[data-dashed]{stroke-dasharray:3 3}
.iso-line[data-flow]{stroke-dasharray:2 6}
.iso-wire-end{fill:var(--anatomy-paper);stroke:var(--anatomy-lo);stroke-width:var(--anatomy-weight)}
.iso-wire[data-tone="hi"] .iso-wire-end{stroke:var(--anatomy-hi)}
.iso-wire[data-tone="mid"] .iso-wire-end{stroke:var(--anatomy-mid)}
.iso-wire[data-tone="faint"] .iso-wire-end{stroke:var(--anatomy-faint)}
.iso-wire[data-tone="lit"] .iso-wire-end{stroke:var(--anatomy-lit)}
.iso-dots circle{fill:var(--anatomy-dot);stroke:none;opacity:.32}
.iso-dots[data-tone="hi"] circle{opacity:.85}
.iso-dots[data-tone="mid"] circle{opacity:.45}
.iso-dots[data-tone="lo"] circle{opacity:.22}
.iso-dots[data-tone="faint"] circle{opacity:.12}
.iso-face-text{fill:var(--anatomy-mid);font-family:var(--anatomy-mono);letter-spacing:.04em}
.iso-face-text[data-tone="hi"]{fill:var(--anatomy-hi)}
.iso-face-text[data-tone="lo"]{fill:var(--anatomy-lo)}
.iso-face-text[data-tone="faint"]{fill:var(--anatomy-faint)}
.tb-body{fill:var(--anatomy-shade-2);stroke:none}
.tb-shine{fill:var(--anatomy-top);stroke:none}
.tb-shade{fill:var(--anatomy-shade-0);stroke:none}
.tb-ring{fill:none;stroke:var(--anatomy-lo);stroke-width:.45;stroke-linecap:butt;stroke-linejoin:round}
.tb-ring[data-tone="mid"]{stroke:var(--anatomy-mid)}
.tb-ring[data-tone="faint"]{stroke:var(--anatomy-faint)}
.tb-ring[data-tone="hi"]{stroke:var(--anatomy-hi)}
@keyframes iso-flow{to{stroke-dashoffset:-32}}
@keyframes iso-pulse{0%,100%{opacity:.18}12%{opacity:1}40%{opacity:.18}}
.iso-line[data-flow]{animation:iso-flow 1600ms linear infinite}
.iso-dots circle[data-pulse]{animation:iso-pulse 1600ms steps(1,end) infinite;animation-delay:var(--pulse-at,0ms)}
.iso-figure{margin:32px 0 36px}
.iso-plate{position:relative;padding:52px 24px;border-radius:0;background:var(--anatomy-card);box-shadow:0 0 0 1px var(--dm-plate-edge,var(--anatomy-mid));--anatomy-paper:var(--anatomy-card)}
.iso-plate-corners{position:absolute;inset:18px 20px;pointer-events:none}
.iso-plate-corner{position:absolute;color:var(--anatomy-muted);font-family:var(--anatomy-mono);font-size:10.5px;line-height:1;letter-spacing:.04em;white-space:nowrap}
.iso-plate-corner[data-corner="fig"]{top:0;left:0;color:var(--anatomy-text)}
.iso-plate-corner[data-corner="title"]{top:0;right:0;text-transform:uppercase;letter-spacing:.1em}
.iso-plate-corner[data-corner="hint"]{bottom:0;left:0;text-transform:uppercase;letter-spacing:.1em}
.iso-plate-corner[data-corner="readout"]{right:0;bottom:0;color:var(--anatomy-text);font-variant-numeric:tabular-nums}
.iso-plate .iso-svg{margin:0 auto}
.iso-legend{display:grid;gap:8px;margin-top:12px;color:var(--anatomy-muted);font-size:13px;line-height:1.55}
.iso-keys{display:flex;flex-wrap:wrap;gap:6px 18px}
.iso-key{display:inline-flex;align-items:center;gap:7px}
.iso-swatch{width:16px;height:10px;flex:none;overflow:visible}
.iso-swatch path{fill:none;stroke:var(--anatomy-hi);stroke-width:1;vector-effect:non-scaling-stroke;stroke-linejoin:round;stroke-linecap:round}
.iso-swatch[data-mark="raised"] path,.iso-swatch[data-mark="flat"] path{stroke:var(--anatomy-mid)}
.iso-swatch[data-mark="lit"] path{stroke:var(--anatomy-lit)}
.iso-swatch[data-mark="dim"] path{stroke:var(--anatomy-lo)}
.iso-swatch[data-mark="dotted"] path{stroke-dasharray:.01 3;stroke-width:1.4}
.iso-swatch[data-mark="dashed"] path{stroke-dasharray:3 2.5}
.iso-swatch[data-mark="red"] path{stroke:var(--anatomy-red)}
.iso-swatch[data-mark="green"] path{stroke:var(--anatomy-green)}
.iso-swatch[data-mark="blue"] path{stroke:var(--anatomy-blue)}
.iso-swatch-crease{stroke:var(--anatomy-lo)!important}
@media (max-width:560px){.iso-plate{padding:48px 12px 70px}.iso-plate-corner[data-corner="hint"]{bottom:18px}}
@media (prefers-reduced-motion:reduce){.iso-line[data-flow],.iso-dots circle[data-pulse]{animation:none}}

*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden}
html{color-scheme:dark}
html[data-theme="light"]{color-scheme:light}
body{background:var(--anatomy-page);color:var(--anatomy-text);font:16px/1.5 "Archivo",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
html.sl-clear{color-scheme:normal}
html.sl-clear body{background:transparent}
.sl{position:absolute;left:50%;top:50%;width:1280px;height:720px;padding:24px;transform:translate(-50%,-50%) scale(var(--sl-scale,1))}
.sl .iso-figure{margin:0;height:100%;display:grid;grid-template-columns:766px 430px;justify-content:center;align-items:center;gap:36px}
.sl .iso-plate{width:766px;padding:40px 22px}
.sl .iso-plate .iso-svg{width:722.0px;height:565.6px}
.sl .iso-plate-corners{inset:15px 18px}
.sl .iso-plate-corner{font-size:12px}
.sl-side{margin:0;display:flex;flex-direction:column;gap:18px;font-size:16px;line-height:1.5;color:var(--anatomy-text);min-width:0}
.sl-eyebrow{font-family:var(--anatomy-mono);font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--dm-red)}
.sl-side h1{margin:-10px 0 0;padding-bottom:10px;border-bottom:3px solid var(--dm-red);color:var(--dm-red);font-size:34px;line-height:1.12;font-weight:700;letter-spacing:-.015em;text-wrap:balance}
.sl-lead{margin:0;font-size:18px;line-height:1.45;text-wrap:pretty}
.sl-facts{margin:0;padding-top:14px;border-top:1px solid var(--dm-rule);display:grid;grid-template-columns:auto 1fr;gap:7px 16px;font-size:15px;line-height:1.4}
.sl-facts dt{padding-top:2px;font-family:var(--anatomy-mono);font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--anatomy-muted);white-space:nowrap}
.sl-facts dd{margin:0;color:var(--anatomy-strong);font-variant-numeric:tabular-nums}
.sl-side .iso-keys{display:grid;gap:8px;padding-top:14px;border-top:1px solid var(--dm-rule);font-size:15px;line-height:1.35}
.sl-side .iso-key{align-items:baseline}
.sl-side .iso-swatch{transform:translateY(1px)}
.sl-controls{display:flex;flex-wrap:wrap;gap:10px}
.sl-button{font-family:var(--anatomy-mono);font-size:13px;letter-spacing:.04em;color:var(--dm-red);background:#ffffff;border:1px solid var(--dm-red);border-radius:0;padding:8px 14px;cursor:pointer;transition:background .15s,color .15s}

.sl-button:focus-visible{outline:2px solid var(--dm-red);outline-offset:3px}

      const dx = b[0] - a[0];
      const dy = b[1] - a[1];
      const t = Math.max(0, Math.min(1, ((p[0] - a[0]) * dx + (p[1] - a[1]) * dy) / (dx * dx + dy * dy || 1)));
      best = Math.min(best, Math.hypot(p[0] - a[0] - dx * t, p[1] - a[1] - dy * t));
    }
    gap = Math.max(gap, best);
  }
  return { fill, outline, gap };
}

const softOf = (meridian) => meridian.some((point) => Boolean(point[2]));

function lathe(meridian, F, P, { steps = stepsFor(Math.max(...meridian.map(([, r]) => r)), 32, 160, scaleOf(P)), fill = "auto", hole = null, bevel = 0, rims = "all", smooth: asked = "auto", waist = 0.5 } = {}) {
  const smooth = asked === "auto" ? softOf(meridian) : asked;
  const V = viewOf(P);
  const L = lightOf(P);
  const aV = dot3(F.a, V);
  const uV = dot3(F.u, V);
  const vV = dot3(F.v, V);
  const aL = dot3(F.a, L);
  const uL = dot3(F.u, L);
  const vL = dot3(F.v, L);
  const n = steps;
  const m = meridian.length;
  const rings = meridian.map(([s, r]) => Array.from({ length: n }, (_, j) => iso(pointOf(F, s, r, (j / n) * TAU), P)));
  const midC = [];
  const midS = [];
  for (let j = 0; j < n; j++) {
    const t = ((j + 0.5) / n) * TAU;
    midC.push(Math.cos(t));
    midS.push(Math.sin(t));
  }
  const seen = [];
  const tones = [];
  for (let i = 0; i < m - 1; i++) {
    const ds = meridian[i + 1][0] - meridian[i][0];
    const dr = meridian[i + 1][1] - meridian[i][1];
    const length = Math.hypot(ds, dr);
    const row = [];
    const toneRow = [];
    for (let j = 0; j < n; j++) {
      if (length < 1e-9) {
        row.push(false);
        toneRow.push(0);
        continue;
      }
      const facing = ds * (midC[j] * uV + midS[j] * vV) - dr * aV;
      const lit = (ds * (midC[j] * uL + midS[j] * vL) - dr * aL) / length;
      row.push(facing > 1e-6 * length);
      toneRow.push(bandOf(lit));
    }
    seen.push(row);
    tones.push(toneRow);
  }
  const buckets = [[], [], [], [], []];
  const all = [];
  const smoothed = smooth ? smoothRows(meridian, F, P, { steps, ...(smooth === true ? {} : smooth) }) : null;
  if (smoothed) smoothed.forEach((list, tone) => list.forEach((d) => (buckets[tone].push(d), all.push(d))));
  for (let i = 0; i < m - 1; i++) {
    if (smoothed && Math.abs(meridian[i + 1][0] - meridian[i][0]) > 1e-9) continue;
    const keys = seen[i].map((visible, j) => (visible ? tones[i][j] : null));
    for (const { key, run } of groupsOf(keys)) {
      const a = run.map((j) => rings[i][j]);
      const b = run.map((j) => rings[i + 1][j]).reverse();
      const d = pathOf(oriented([...a, ...b]), true);
      buckets[key].push(d);
      all.push(d);
    }
  }
  const phi = Math.atan2(vV, uV);
  const flatV = Math.hypot(uV, vV);
  const rangeOf = (i) => {
    const ds = meridian[i + 1][0] - meridian[i][0];
    const dr = meridian[i + 1][1] - meridian[i][1];
    if (Math.hypot(ds, dr) < 1e-9) return null;
    if (Math.abs(ds) < 1e-9 || flatV < 1e-9) return -dr * aV > 1e-9 ? [-1, 1] : null;
    const c = (dr * aV) / (ds * flatV);
    return ds > 0 ? [Math.max(-1, c), 1] : [-1, Math.min(1, c)];
  };
  const arcsOf = (ranges) => {
    if (ranges.some((range) => !range)) return [];
    const lo = Math.max(...ranges.map(([x]) => x));
    const hi = Math.min(...ranges.map(([, x]) => x));
    if (lo >= hi - 1e-9) return [];
    const near = Math.acos(Math.min(1, hi));
    const far = Math.acos(Math.max(-1, lo));
    if (hi >= 1 && lo <= -1) return [[phi, phi + TAU]];
    if (hi >= 1) return [[phi - far, phi + far]];
    if (lo <= -1) return [[phi + near, phi + TAU - near]];
    return [[phi + near, phi + far], [phi - far, phi - near]];
  };
  const along = (s, r, [from, to]) => {
    const count = Math.max(2, Math.ceil(((to - from) * Math.max(r, 1e-6) * scaleOf(P)) / 1.5));
    return Array.from({ length: count + 1 }, (_, j) => iso(pointOf(F, s, r, from + ((to - from) * j) / count), P));
  };
  const creases = [];
  for (let i = 1; i < m - 1; i++) {
    if (meridian[i][2] || meridian[i][1] <= 1e-9) continue;
    for (const arc of arcsOf([rangeOf(i - 1), rangeOf(i)])) creases.push(pathOf(along(meridian[i][0], meridian[i][1], arc)));
  }
  let bevelPath = "";
  if (bevel > 0 && m > 2) {
    const ends = [];
    if (meridian[0][1] <= 1e-9) ends.push([0, 1, 1]);
    if (meridian[m - 1][1] <= 1e-9) ends.push([m - 2, m - 2, m - 3]);
    for (const [cap, rim, side] of ends) {
      const [s, r] = meridian[rim];
      for (const arc of arcsOf([rangeOf(cap), rangeOf(side)])) {
        const inset = along(s, Math.max(0, r - bevel), arc);
        const edge = along(s, r, arc);
        bevelPath += pathOf([edge[0], ...inset.slice(1, -1), edge[edge.length - 1]]);
      }
    }
  }
  const { fill: fillPath, outline } = outlineOf(meridian, F, P, { steps: n, fill, hole, rims, smooth, waist, all });
  return {
    fill: fillPath,
    outline,
    crease: creases.join(""),
    top: buckets[4].join(""),
    shades: buckets.slice(0, 4).map((list) => list.join("")),
    bevel: bevelPath || undefined,
    seamless: Boolean(smoothed),
  };
}

function shapeOf(meridian, P, smooth) {
  if (smooth && smooth.radius) {
    const segments = meridian.slice(0, -1).map(([s0], index) => (Math.abs(meridian[index + 1][0] - s0) > 1e-9 ? { radius: smooth.radius, slope: smooth.slope } : null));
    return curved(meridian, P, segments);
  }
  const curves = smooth && !smooth.slope ? curveRuns(meridian) : null;
  return curves && curves.some(Boolean) ? curved(meridian, P, curves) : meridian;
}

function outlineOf(meridian, F, P, { steps = stepsFor(Math.max(...meridian.map(([, r]) => r)), 32, 160, scaleOf(P)), fill = "auto", hole = null, rims = "all", smooth: asked = "auto", waist = 0.5, all = null } = {}) {
  const smooth = asked === "auto" ? softOf(meridian) : asked;
  const n = steps;
  let fillPath;
  let outline;
  const shape = shapeOf(meridian, P, smooth);
  const side = fill === "auto" || fill === "surface" ? sideOf(shape) : null;
  const surface = side && !hole ? surfaceOf(side, F, P, rims, { slope: smooth && smooth.slope ? smooth.slope : null }) : null;
  if (surface && (fill === "surface" || surface.gap > waist)) {
    fillPath = surface.fill;
    outline = surface.outline;
  } else if (fill === "hull" || fill === "auto" || fill === "surface") {
    const most = Math.max(...shape.map(([, r]) => r));
    const around = Math.min(320, Math.max(n, Math.ceil((TAU * most * scaleOf(P)) / 1.5)));
    const tagged = [];
    shape.forEach(([s, r], index) => {
      for (let j = 0; j < around; j++) tagged.push({ p: iso(pointOf(F, s, r, (j / around) * TAU), P), ring: index });
    });
    const hull = hullTagged(tagged);
    const holePath = hole ? pathOf(Array.from({ length: around }, (_, j) => iso(pointOf(F, hole[0], hole[1], (j / around) * TAU), P)), true) : "";
    fillPath = pathOf(hull.map(({ p }) => p), true) + holePath;
    if (rims === "all") {
      outline = pathOf(hull.map(({ p }) => p), true) + holePath;
    } else {
      const keepFirst = rims === "first" || rims === "ends";
      const keepLast = rims === "last" || rims === "ends";
      const edges = hull.map((a, index) => {
        const b = hull[(index + 1) % hull.length];
        const same = a.ring === b.ring;
        const keep = !same || (a.ring !== 0 && a.ring !== shape.length - 1) || (keepFirst && a.ring === 0) || (keepLast && a.ring === shape.length - 1);
        return [a.p, b.p, keep];
      });
      outline = chains(edges).map((points) => pathOf(points)).join("") + holePath;
    }
  } else {
    fillPath = all ? all.join("") : (({ shades, top }) => [...shades, top].join(""))(lathe(meridian, F, P, { steps: n, fill: "auto", hole, rims, smooth, waist }));
    outline = "";
  }
  return { fill: fillPath, outline };
}

const signedArea = (points) => points.reduce((sum, [x, y], index) => {
  const [nx, ny] = points[(index + 1) % points.length];
  return sum + x * ny - nx * y;
}, 0);

const oriented = (points) => (signedArea(points) < 0 ? [...points].reverse() : points);

const saddleStart = (R, a, angle) => Math.sqrt(Math.max(0, R * R - a * a * Math.cos(angle) ** 2));

function saddleOf(F, a, start, s1, P, { steps = stepsFor(a, 24) } = {}) {
  const V = viewOf(P);
  const L = lightOf(P);
  const n = steps;
  const angle = (j) => (j / n) * TAU;
  const from = typeof start === "function" ? start : (t) => saddleStart(start, a, t);
  const low = Array.from({ length: n }, (_, j) => iso(pointOf(F, from(angle(j)), a, angle(j)), P));
  const high = Array.from({ length: n }, (_, j) => iso(pointOf(F, s1, a, angle(j)), P));
  const seen = [];
  const tones = [];
  for (let j = 0; j < n; j++) {
    const normal = radialOf(F, angle(j + 0.5));
    seen.push(dot3(normal, V) > 1e-6);
    tones.push(bandOf(dot3(normal, L)));
  }
  const buckets = [[], [], [], [], []];
  const fills = [];
  const keys = seen.map((visible, j) => (visible ? tones[j] : null));
  for (const { key, run } of groupsOf(keys)) {
    const d = pathOf(oriented([...run.map((j) => low[j]), ...run.map((j) => high[j]).reverse()]), true);
    buckets[key].push(d);
    fills.push(d);
  }
  const capSeen = dot3(F.a, V) > 1e-6;
  if (capSeen) {
    const d = pathOf(oriented(high), true);
    buckets[bandOf(dot3(F.a, L))].push(d);
    fills.push(d);
  }
  const front = runsOf(seen);
  const back = runsOf(seen.map((visible) => !visible));
  const edges = [];
  for (const run of front) {
    edges.push(pathOf(run.map((j) => low[j])));
    edges.push(pathOf([low[run[0]], high[run[0]]]), pathOf([low[run[run.length - 1]], high[run[run.length - 1]]]));
  }
  for (const run of capSeen ? back : front) edges.push(pathOf(run.map((j) => high[j])));
  return {
    fill: fills.join(""),
    outline: edges.join(""),
    crease: capSeen ? front.map((run) => pathOf(run.map((j) => high[j]))).join("") : "",
    top: buckets[4].join(""),
    shades: buckets.slice(0, 4).map((list) => list.join("")),
    seamless: true,
  };
}

function prismOf(F, polygon, s0, s1, P) {
  const V = viewOf(P);
  const L = lightOf(P);
  const ring = oriented(polygon.map(([x, y]) => [x, y]));
  const n = ring.length;
  const at = (s, [x, y]) => [F.o[0] + F.a[0] * s + F.u[0] * x + F.v[0] * y, F.o[1] + F.a[1] * s + F.u[1] * x + F.v[1] * y, F.o[2] + F.a[2] * s + F.u[2] * x + F.v[2] * y];
  const low = ring.map((point) => iso(at(s0, point), P));
  const high = ring.map((point) => iso(at(s1, point), P));
  const buckets = [[], [], [], [], []];
  const seen = [];
  for (let j = 0; j < n; j++) {
    const [x0, y0] = ring[j];
    const [x1, y1] = ring[(j + 1) % n];
    const normal = unit3(add3(mul3(F.u, y1 - y0), mul3(F.v, -(x1 - x0))));
    const visible = dot3(normal, V) > 1e-6;
    seen.push(visible);
    if (visible) buckets[bandOf(dot3(normal, L))].push(pathOf([low[j], low[(j + 1) % n], high[(j + 1) % n], high[j]], true));
  }
  const ends = [[s0, low, mul3(F.a, -1)], [s1, high, F.a]];
  const capSeen = ends.map(([, , normal]) => dot3(normal, V) > 1e-6);
  ends.forEach(([, points, normal], index) => capSeen[index] && buckets[bandOf(dot3(normal, L))].push(pathOf(points, true)));
  const hull = hullOf([...low, ...high]);
  const creases = [];
  for (let j = 0; j < n; j++) {
    const prev = (j - 1 + n) % n;
    const a = [ring[j][0] - ring[prev][0], ring[j][1] - ring[prev][1]];
    const b = [ring[(j + 1) % n][0] - ring[j][0], ring[(j + 1) % n][1] - ring[j][1]];
    const sharp = (a[0] * b[0] + a[1] * b[1]) / (Math.hypot(a[0], a[1]) * Math.hypot(b[0], b[1]) || 1) < Math.cos(0.35);
    if (sharp && seen[j] && seen[prev]) creases.push(pathOf([low[j], high[j]]));
    ends.forEach(([, points], index) => capSeen[index] && seen[j] && creases.push(pathOf([points[j], points[(j + 1) % n]])));
  }
  return { fill: pathOf(hull, true), outline: pathOf(hull, true), crease: creases.join(""), top: buckets[4].join(""), shades: buckets.slice(0, 4).map((list) => list.join("")) };
}

function stadium(r0, r1, offset, steps = 32) {
  const circle = (cx, r) => Array.from({ length: steps }, (_, index) => [cx + r * Math.cos((index / steps) * TAU), r * Math.sin((index / steps) * TAU)]);
  return hullOf([...circle(0, r0), ...circle(offset, r1)]);
}

function sphereOf(centre, r, P, { steps = 48 } = {}) {
  const V = viewOf(P);
  const L = lightOf(P);
  const F = frameAlong(centre, V);
  const flat = (p) => iso(p, P);
  const rim = Array.from({ length: steps }, (_, index) => pointOf(F, 0, r, (index / steps) * TAU));
  const outline = pathOf(rim.map(flat), true);
  const capOf = (threshold) => {
    const points = rim.filter((p) => dot3(sub3(p, centre), L) / r >= threshold).map(flat);
    const c = dot3(L, V);
    const LF = frameAlong(add3(centre, mul3(L, r * threshold)), L);
    const radius = r * Math.sqrt(Math.max(0, 1 - threshold * threshold));
    for (let index = 0; index < steps; index++) {
      const p = pointOf(LF, 0, radius, (index / steps) * TAU);
      if (dot3(sub3(p, centre), V) >= -1e-9) points.push(flat(p));
    }
    if (c > threshold) points.push(flat(add3(centre, mul3(V, r))));
    return points.length > 2 ? pathOf(hullOf(points), true) : "";
  };
  const shades = [outline, capOf(BANDS[1]), capOf(BANDS[2]), capOf(BANDS[3])];
  return { fill: outline, outline, crease: "", top: "", shades, seamless: true };
}

const disc = (s0, s1, r, F, P, options = {}) =>
  lathe(
    [
      [s0, 0],
      [s0, r],
      [s1, r],
      [s1, 0],
    ],
    F,
    P,
    { steps: stepsFor(r, 32, 160, scaleOf(P)), ...options },
  );

const ringBand = (s0, s1, rIn, rOut, F, P, options = {}) =>
  lathe(
    [
      [s0, rIn],
      [s0, rOut],
      [s1, rOut],
      [s1, rIn],
    ],
    F,
    P,
    { steps: stepsFor(rOut, 32, 160, scaleOf(P)), hole: null, ...options },
  );

function solidOf(profile, F, P, options = {}) {
  const first = profile[0];
  const last = profile[profile.length - 1];
  const meridian = [[first[0], 0], ...profile, [last[0], 0]];
  const most = Math.max(...profile.map(([, r]) => r));
  return lathe(meridian, F, P, { steps: stepsFor(most, 32, 160, scaleOf(P)), ...options });
}

function bandOfProfile(profile, F, P, options = {}) {
  const most = Math.max(...profile.map(([, r]) => r));
  return lathe(profile, F, P, { steps: stepsFor(most, 32, 160, scaleOf(P)), ...options });
}

function silhouettePoints(profile, F, P, { samples = 72, slope: given = null, radius = null } = {}) {
  const V = viewOf(P);
  const aV = dot3(F.a, V);
  const uV = dot3(F.u, V);
  const vV = dot3(F.v, V);
  const facing = Math.atan2(vV, uV);
  const flat = Math.hypot(uV, vV) || 1e-9;
  const s0 = profile[0][0];
  const s1 = profile[profile.length - 1][0];
  const radiusAt = radius ?? ((s) => {
    let index = 1;
    while (index < profile.length - 1 && profile[index][0] < s) index++;
    const [sa, ra] = profile[index - 1];
    const [sb, rb] = profile[index];
    return ra + ((rb - ra) * (s - sa)) / (sb - sa || 1);
  });
  const side = (sign) => {
    const points = [];
    for (let step = 0; step <= samples; step++) {
      const s = s0 + ((s1 - s0) * step) / samples;
      const h = (s1 - s0) / samples / 2 || 0.01;
      const slope = given ? given(s) : (radiusAt(Math.min(s1, s + h)) - radiusAt(Math.max(s0, s - h))) / (Math.min(s1, s + h) - Math.max(s0, s - h) || 1);
      const c = (slope * aV) / flat;
      if (Math.abs(c) > 1) continue;
      points.push(pointOf(F, s, radiusAt(s), facing + sign * Math.acos(c)));
    }
    return points;
  };
  return [side(1), side(-1)];
}

const silhouetteOf = (profile, F, P, options = {}) =>
  silhouettePoints(profile, F, P, options)
    .map((points) => pathOf(points.map((point) => iso(point, P))))
    .join("");

function profileCurve(profile, { slope = null, radius = null } = {}) {
  for (let index = 1; index < profile.length; index++) if (profile[index][0] - profile[index - 1][0] <= 1e-9) throw new Error(`profileCurve: s must rise along the profile (point ${index} at s = ${profile[index][0]})`);
  const segments = curveRuns(profile);
  const s0 = profile[0][0];
  const s1 = profile[profile.length - 1][0];
  const find = (s) => {
    let lo = 0;
    let hi = profile.length - 2;
    while (lo < hi) {
      const mid = (lo + hi + 1) >> 1;
      if (profile[mid][0] <= s) lo = mid;
      else hi = mid - 1;
    }
    return lo;
  };
  const linear = (index, s) => {
    const [sa, ra] = profile[index];
    const [sb, rb] = profile[index + 1];
    return [ra + ((rb - ra) * (s - sa)) / (sb - sa), (rb - ra) / (sb - sa)];
  };
  const radiusAt = radius ?? ((s) => {
    const at = Math.max(s0, Math.min(s1, s));
    const index = find(at);
    return segments[index] ? segments[index].radius(at) : linear(index, at)[0];
  });
  const slopeAt = slope ?? ((s) => {
    const at = Math.max(s0, Math.min(s1, s));
    const index = find(at);
    return segments[index] ? segments[index].slope(at) : linear(index, at)[1];
  });
  return { s0, s1, radius: radiusAt, slope: slopeAt, analytic: Boolean(slope && radius) };
}

function bandsOf(profile, cuts, F, P, { slope = null, radius = null, steps, rows = 6, rims = "none", fill = "auto", samples = 72 } = {}) {
  const curve = profileCurve(profile, { slope, radius });
  const { s0, s1 } = curve;
  const stops = [s0, ...[...new Set(cuts)].filter((s) => s > s0 + 1e-6 && s < s1 - 1e-6).sort((a, b) => a - b), s1];
  const most = Math.max(...profile.map(([, r]) => r), ...stops.map((s) => curve.radius(s)));
  const n = steps ?? stepsFor(most, 32, 160, scaleOf(P));
  const knot = (s, soft) => (soft ? [s, curve.radius(s), 1] : [s, curve.radius(s)]);
  const meridianOf = (a, b) => [knot(a), ...profile.filter(([s]) => s > a + 1e-9 && s < b - 1e-9).map(([s, , soft]) => knot(s, soft)), knot(b)];
  const shading = { slope: curve.slope, radius: curve.radius, rows };
  const bands = stops.slice(0, -1).map((a, index) => {
    const b = stops[index + 1];
    const meridian = meridianOf(a, b);
    const paths = lathe(meridian, F, P, { steps: n, rims, fill, smooth: shading });
    const seam = index < stops.length - 2 ? arcOf(F, b, curve.radius(b), P, { slope: curve.slope(b) }) : "";
    return { s0: a, s1: b, profile: meridian, paths: { ...paths, outline: "" }, outline: paths.outline, seam };
  });
  const sidesOf = (from = s0, to = s1, { ends = false, count = samples } = {}) => {
    const span = [Math.max(s0, from), Math.min(s1, to)];
    const dense = Array.from({ length: count + 1 }, (_, index) => knot(span[0] + ((span[1] - span[0]) * index) / count, true));
    const points = silhouettePoints(dense, F, P, { samples: count, slope: curve.slope, radius: curve.radius });
    const rim = (s) => arcOf(F, s, curve.radius(s), P, { slope: curve.slope(s) });
    const rimsAt = ends === true ? span : ends === "first" ? [span[0]] : ends === "last" ? [span[1]] : [];
    return { d: points.map((list) => pathOf(list.map((point) => iso(point, P)))).join("") + rimsAt.map(rim).join(""), points };
  };
  return { bands, sidesOf, radius: curve.radius, slope: curve.slope, steps: n, s0, s1 };
}

function arcOf(F, s, r, P, { slope = 0, steps = 0, least = 0.02, inward = false, from = 0, to = TAU, trim = 0.3 } = {}) {
  const V = viewOf(P);
  const aV = dot3(F.a, V);
  const uV = dot3(F.u, V);
  const vV = dot3(F.v, V);
  const flat = Math.hypot(uV, vV);
  const phi = Math.atan2(vV, uV);
  const norm = Math.hypot(1, slope);
  const full = Math.abs(to - from - TAU) < 1e-9;
  let visible;
  if (flat < 1e-9) visible = (inward ? slope * aV / norm > least : -slope * aV / norm > least) ? [[phi, phi + TAU]] : [];
  else if (inward) {
    const c = (slope * aV - least * norm) / flat;
    visible = c <= -1 ? [] : c >= 1 ? [[phi, phi + TAU]] : [[phi + Math.acos(c), phi + TAU - Math.acos(c)]];

  // ---------------------------------------------------------- the return tube
  // A cross-section swept along a centreline. `ring` is a counter-clockwise
  // polygon in each station's (u, v); `cull` drops facets that are never seen,
  // `cut` marks vertices where the tube is split, whose strokes become seams.
  const ringOf = (n, r) => Array.from({ length: n }, (_, j) => [r * Math.cos((j / n) * Math.PI * 2), r * Math.sin((j / n) * Math.PI * 2)]);
  const halfRing = (from, n, r, rIn) => [
    ...Array.from({ length: n + 1 }, (_, j) => [r * Math.cos(from + (j / n) * Math.PI), r * Math.sin(from + (j / n) * Math.PI)]),
    ...Array.from({ length: n + 1 }, (_, j) => [rIn * Math.cos(from + Math.PI - (j / n) * Math.PI), rIn * Math.sin(from + Math.PI - (j / n) * Math.PI)]),
  ];
  function sweep(stations, ring, { keep = () => true, cut = () => false, ends = [{}, {}] } = {}) {
    const n = ring.length;
    const m = stations.length;
    const W = (i, j) => {
      const s = stations[i];
      return at(G.add3(s.c, G.add3(G.mul3(s.u, ring[j][0]), G.mul3(s.v, ring[j][1]))));
    };
    const pts = stations.map((_, i) => ring.map((_, j) => W(i, j)));
    const normalAt = (i, j) => {
      const [p0, q0] = ring[j];
      const [p1, q1] = ring[(j + 1) % n];
      const s = stations[i];
      return G.unit3(G.add3(G.mul3(s.u, q1 - q0), G.mul3(s.v, -(p1 - p0))));
    };
    const facing = [];
    const normals = [];
    const buckets = [[], [], [], [], []];
    const fills = [];
    for (let i = 0; i < m - 1; i++) {
      facing.push([]);
      normals.push([]);
      for (let j = 0; j < n; j++) {
        const nm = G.unit3(G.add3(normalAt(i, j), normalAt(i + 1, j)));
        normals[i].push(nm);
        const seen = keep(j) && G.dot3(nm, V) > 1e-6;
        facing[i].push(seen);
        if (!seen) continue;
        const quad = oriented([pts[i][j], pts[i][(j + 1) % n], pts[i + 1][(j + 1) % n], pts[i + 1][j]]);
        fills.push(k.pathOf(quad, true));
        buckets[G.toneOf(nm, P)].push(k.pathOf(quad, true));
      }
    }
    const outline = [];
    const crease = [];
    const seam = [];
    const seg = (a, b) => k.pathOf([a, b]);
    for (let i = 0; i < m - 1; i++) {
      for (let j = 0; j < n; j++) {
        const prev = (j - 1 + n) % n;
        const line = seg(pts[i][j], pts[i + 1][j]);
        if (facing[i][prev] !== facing[i][j]) (cut(j) ? seam : outline).push(line);
        else if (facing[i][j] && G.dot3(normals[i][prev], normals[i][j]) < Math.cos(0.5)) (cut(j) ? seam : crease).push(line);
        if (i > 0 && facing[i - 1][j] !== facing[i][j]) outline.push(seg(pts[i][j], pts[i][(j + 1) % n]));
      }
    }
    // an end either shows its cross-section (cap), carries a rim stroke, or runs on into another piece
    ends.forEach((end, e) => {
      const i = e ? m - 1 : 0;
      const row = facing[e ? m - 2 : 0];
      const s = stations[i];
      const outward = e ? s.t : G.mul3(s.t, -1);
      const capped = end.cap && G.dot3(outward, V) > 1e-6;
      if (capped) {
        const cap = end.cap.map((j) => pts[i][j]);
        fills.push(k.pathOf(oriented(cap), true));
        buckets[G.toneOf(outward, P)].push(k.pathOf(oriented(cap), true));
        end.cap.forEach((j, c) => {
          const next = end.cap[(c + 1) % end.cap.length];
          const line = seg(pts[i][j], pts[i][next]);
          // a cut end only shows its edges once the halves have parted
          if (end.capLine === "seam") return seam.push(line);
          if ((next - j + n) % n !== 1) return outline.push(line);
          (row[j] ? crease : outline).push(line);
        });
      }
      for (let j = 0; j < n; j++) {
        if (!row[j] || (capped && end.cap.includes(j) && end.cap.includes((j + 1) % n))) continue;
        const kind = end.line ? end.line(j) : "outline";
        if (kind === "outline") outline.push(seg(pts[i][j], pts[i][(j + 1) % n]));
        else if (kind === "seam") seam.push(seg(pts[i][j], pts[i][(j + 1) % n]));
      }
    });
    return { paths: { fill: fills.join(""), outline: outline.join(""), crease: crease.join(""), top: buckets[4].join(""), shades: buckets.slice(0, 4).map((b) => b.join("")) }, seam: seam.join("") };
  }

  // stations along a centreline, framed by parallel transport from a known frame at one end
  const stationsOf = (points, frame, { from = 0 } = {}) => {
    const tangent = (i) => G.unit3(G.sub3(points[Math.min(points.length - 1, i + 1)], points[Math.max(0, i - 1)]));
    const out = points.map((c) => ({ c }));
    const order = from === 0 ? points.map((_, i) => i) : points.map((_, i) => points.length - 1 - i);
    let u = frame.u;
    for (const i of order) {
      const t = tangent(i);
      u = G.unit3(G.sub3(u, G.mul3(t, G.dot3(u, t))));
      out[i] = { c: points[i], t, u, v: G.cross3(t, u) };
    }
    // keep v on the frame's side so the halves of the bridge line up with the bends
    const flip = G.dot3(out[from === 0 ? 0 : points.length - 1].v, frame.v) < 0;
    return flip ? out.map((s) => ({ ...s, v: G.mul3(s.v, -1) })) : out;
  };

  const TB = D.tube;
  const ROUTES = D.circuits.map((x0) => returnRoute(x0));
  const placeOf = (pose) => {
    const c = Math.cos(pose.turn);
    const s = Math.sin(pose.turn);
    const rot = ([x, y, z]) => [x, y * c - z * s, y * s + z * c];
    return { rot, point: (p, lift = 0) => G.add3(rot(p), [pose.shift, 0, ZA + lift]) };
  };
  // where a leg of the route passes out through the nut's skin
  const surfaceOn = (route, from, to, skin = D.nut.rOut) => {
    const step = from < to ? 1 : -1;
    for (let i = from; i !== to; i += step) {
      const a = route[i];
      const b = route[i + step];
      const ra = Math.hypot(a[1], a[2]);
      const rb = Math.hypot(b[1], b[2]);
      if ((ra - skin) * (rb - skin) <= 0) {
        const t = (skin - ra) / (rb - ra || 1);
        return { i, p: G.lerp3(a, b, t) };
      }
    }
    return { i: from, p: route[from] };
  };
  // the bore of a leg where it meets the nut's skin, as a dark rim round the tube
  const holeAt = (q, t, place, lift) => {
    const helper = Math.abs(t[0]) < 0.9 ? [1, 0, 0] : [0, 1, 0];
    const u = G.unit3(G.cross3(t, helper));
    const v = G.cross3(t, u);
    const rho = TB.r + 0.35;
    const pts = Array.from({ length: 28 }, (_, j) => {
      const a = (j / 28) * Math.PI * 2;
      const base = G.add3(q, G.add3(G.mul3(u, rho * Math.cos(a)), G.mul3(v, rho * Math.sin(a))));
      // slide along the leg until the bore wall meets the skin
      let lo = -4;
      let hi = 4;
      const f = (sv) => Math.hypot(base[1] + t[1] * sv, base[2] + t[2] * sv) - D.nut.rOut;
      if (f(lo) * f(hi) > 0) return place.point(base, lift);
      for (let it = 0; it < 30; it++) {
        const mid = (lo + hi) / 2;
        if (f(lo) * f(mid) <= 0) hi = mid;
        else lo = mid;
      }
      return place.point(G.add3(base, G.mul3(t, (lo + hi) / 2)), lift);
    });
    return `<path class="pb-hole" d="${k.pathOf(pts.map(at), true)}"/>`;
  };

  // the clamp that holds the bridge down: a strap over the tube, an ear on the nut and one screw
  const HOLD = (() => {
    const R = TB.R;
    const ro = TB.r + 0.75;
    const strapOut = Array.from({ length: 13 }, (_, j) => {
      const a = ((128 * j) / 12) * (Math.PI / 180);
      return [R + ro * Math.cos(a), ro * Math.sin(a)];
    });
    const strapIn = Array.from({ length: 13 }, (_, j) => {
      const a = ((128 * (12 - j)) / 12) * (Math.PI / 180);
      return [R + TB.r * Math.cos(a), TB.r * Math.sin(a)];
    });
    const earOut = Array.from({ length: 7 }, (_, j) => {
      const a = ((8.4 + (12.6 * j) / 6) * Math.PI) / 180;
      return [(D.nut.rOut + 0.75) * Math.cos(a), (D.nut.rOut + 0.75) * Math.sin(a)];
    });
    const earIn = Array.from({ length: 7 }, (_, j) => {
      const a = ((21 - (16 * j) / 6) * Math.PI) / 180;
      return [D.nut.rOut * Math.cos(a), D.nut.rOut * Math.sin(a)];
    });
    return { poly: [...strapOut, ...earOut, ...earIn, ...strapIn], half: 3.5, screwAt: (14.6 * Math.PI) / 180 };
  })();

  // Every piece of one nut's return tube, placed for a pose: the nut's shift
  // along the screw, its turn about the axis and the lift of its top half.
  // `split` draws the bridge as the two halves the section cuts it into.
  function tubeParts(n, pose, { split = true } = {}) {
    const { route, je, js } = ROUTES[n];
    const place = placeOf(pose);
    const lift = pose.lift ?? 0;
    const radial = place.rot([0, 1, 0]);
    const tangential = place.rot([0, 0, 1]);
    const frame = { u: radial, v: tangential };
    const toWorld = (pts, up) => pts.map((p) => place.point(p, up ? lift : 0));
    const low = surfaceOn(route, je, 0);
    const high = surfaceOn(route, js, route.length - 1);
    // the legs leave the skin at a slant: stop each bend where its whole section is clear
    // of the nut, and let the dark bore round it fill the rest
    const lowEnd = surfaceOn(route, je, 0, D.nut.rOut + 0.9);
    const highEnd = surfaceOn(route, js, route.length - 1, D.nut.rOut + 0.9);
    const lowPts = toWorld([lowEnd.p, ...route.slice(lowEnd.i + 1, je + 1)], false);
    const highPts = toWorld([...route.slice(js, highEnd.i + 1), highEnd.p], true);
    const full = ringOf(24, TB.r);
    const upperHalf = (j) => full[j][1] > 1e-6 || (full[j][1] > -1e-6 && full[(j + 1) % 24][1] > 1e-6);
    const parts = {};
    const elbowLow = sweep(stationsOf(lowPts, frame, { from: lowPts.length - 1 }), full, { ends: [{}, { line: (j) => (upperHalf(j) ? "seam" : "none") }] });
    parts.elbowLow = S(elbowLow.paths, { tone: "hi" }) + seamSvg(elbowLow.seam);
    const lowerCap = full.map((_, j) => j).filter((j) => full[j][1] <= 1e-6);
    // the lower half of the upper bend's mouth is cut, and shows once it has lifted
    const capRing = [...lowerCap.map((j) => full[j]), ...lowerCap.slice().reverse().map((j) => [full[j][0] * (TB.rIn / TB.r), full[j][1] * (TB.rIn / TB.r)])];
    const elbowUp = sweep(stationsOf(highPts, frame), full, { ends: [{ line: (j) => (upperHalf(j) ? "none" : "seam") }, {}] });
    parts.elbowUp = S(elbowUp.paths, { tone: "hi" }) + seamSvg(elbowUp.seam) + mouthOf(highPts[0], frame, capRing);
    const bridge = toWorld([route[je], route[js]], false);
    const bridgeUp = toWorld([route[je], route[js]], true);
    const straight = (pts) => pts.map((c) => ({ c, t: G.unit3(G.sub3(pts[1], pts[0])), u: radial, v: tangential }));
    if (split) {
      const cover = halfRing(0, 12, TB.r, TB.rIn);
      const coverCut = (j) => j === 0 || j === 12 || j === 13 || j === 25;
      const coverSweep = sweep(straight(bridgeUp), cover, { keep: (j) => j <= 12 || j === 25, cut: coverCut, ends: [{ line: () => "none" }, { line: () => "none" }] });
      // its cut end under the lower bend only shows once the top has lifted
      parts.cover = S(coverSweep.paths, { tone: "hi" }) + seamSvg(coverSweep.seam) + mouthOf(bridgeUp[0], frame, cover);
      const trough = halfRing(Math.PI, 12, TB.r, TB.rIn);
      const troughCut = coverCut;
      // where the trough stops under the upper bend its rim only shows once the bend has lifted
      const back = sweep(straight(bridge), trough, { keep: (j) => j >= 13, cut: troughCut, ends: [{ line: () => "none" }, { line: () => "seam" }] });
      const front = sweep(straight(bridge), trough, { keep: (j) => j <= 12, cut: troughCut, ends: [{ line: () => "none" }, { line: () => "seam" }] });
      parts.troughBack = S(back.paths, { tone: "hi" }) + seamSvg(back.seam);
      parts.troughFront = S(front.paths, { tone: "hi" }) + seamSvg(front.seam);
    } else {
      parts.bridge = S(sweep(straight(bridge), full, { ends: [{ line: () => "none" }, { line: () => "none" }] }).paths, { tone: "hi" });
    }
    // the clamp: an extruded hook profile at the middle of the bridge
    const xm = (route[je][0] + route[js][0]) / 2;
    const ring = oriented(HOLD.poly);
    const holdStations = [xm + HOLD.half, xm - HOLD.half].map((x) => ({ c: place.point([x, 0, 0], lift), t: [-1, 0, 0], u: radial, v: tangential }));
    const hold = sweep(holdStations, ring, { ends: [{ cap: ring.map((_, j) => j) }, {}] });
    const sa = HOLD.screwAt + pose.turn;
    const dir = [0, Math.cos(sa), Math.sin(sa)];
    const FS = G.frameOf(G.add3([xm + pose.shift, 0, ZA + lift], [0, 0, 0]), dir, [1, 0, 0], G.cross3(dir, [1, 0, 0]));
    const s0 = D.nut.rOut + 0.75;
    parts.holder = S(hold.paths, { tone: "mid" }) + S(G.disc(s0, s0 + 1.3, 2.2, FS, P, { steps: 20, bevel: 0.3 }), { tone: "mid" }) + socketAt(FS, s0 + 1.3);
    parts.holeLow = holeAt(low.p, G.unit3(G.sub3(route[low.i + 1], route[low.i])), place, 0);
    parts.holeHigh = holeAt(high.p, G.unit3(G.sub3(route[high.i + 1] ?? high.p, route[high.i])), place, lift);
    // where each piece faces, so a turning nut can draw it behind or in front of itself
    const facingOf = (angle) => Math.cos(angle) * V[1] + Math.sin(angle) * V[2];
    const tilt = Math.atan2(low.p[2], low.p[1]);
    parts.facing = { bridge: facingOf(pose.turn), elbowLow: facingOf(pose.turn + tilt), elbowUp: facingOf(pose.turn - tilt), holder: facingOf(pose.turn + HOLD.screwAt) };
    parts.shapes = {
      elbowLow: A_tube(lowPts, TB.r, `tube${n + 1}.elbow.low`),
      elbowUp: A_tube(highPts, TB.r, `tube${n + 1}.elbow.high`),
      cover: { kind: "prism", F: { o: [0, 0, ZA + lift], a: [1, 0, 0], u: radial, v: tangential }, poly: halfRing(0, 12, TB.r, TB.rIn).map(([p, q]) => [p + TB.R, q]), s0: route[js][0] + pose.shift, s1: route[je][0] + pose.shift, name: `tube${n + 1}.cover`, owner: `tube${n + 1}` },
      trough: { kind: "prism", F: { o: [0, 0, ZA], a: [1, 0, 0], u: radial, v: tangential }, poly: halfRing(Math.PI, 12, TB.r, TB.rIn).map(([p, q]) => [p + TB.R, q]), s0: route[js][0] + pose.shift, s1: route[je][0] + pose.shift, name: `tube${n + 1}.trough`, owner: `tube${n + 1}` },
      holder: { kind: "prism", F: { o: [0, 0, ZA + lift], a: [1, 0, 0], u: radial, v: tangential }, poly: HOLD.poly, s0: xm - HOLD.half + pose.shift, s1: xm + HOLD.half + pose.shift, name: `tube${n + 1}.clamp`, owner: `tube${n + 1}` },
    };
    return parts;
  }
  // A turning nut's tube, sorted into the slot behind the nut and the slot in
  // front of it, piece by piece as each one passes the limb. Square to the
  // section (a whole number of turns) the bridge is drawn as its two halves.
  const tubeSlots = (n, pose) => {
    const split = Math.abs(Math.sin(pose.turn / 2)) < 1e-4;
    const t = tubeParts(n, pose, { split });
    const holes = [[t.holeLow, t.facing.elbowLow], [t.holeHigh, t.facing.elbowUp]]
      .map(([svg, f]) => {
        const alpha = G.fadeOf(f, [0.02, 0.3]);
        return alpha > 0.02 ? (alpha < 0.995 ? `<g opacity="${alpha.toFixed(2)}">${svg}</g>` : svg) : "";
      })
      .join("");
    if (split) return { back: "", a: holes + t.elbowUp + t.troughBack, b: t.troughFront + t.cover + t.holder + t.elbowLow, shapes: { back: [], front: [t.shapes.elbowUp, t.shapes.trough, t.shapes.cover, t.shapes.holder, t.shapes.elbowLow] } };
    const { route, je, js } = ROUTES[n];
    const place = placeOf(pose);
    const bridgeShape = A_tube([place.point(route[je]), place.point(route[js])], TB.r, `tube${n + 1}.bridge`);
    const pieces = { elbowUp: [t.elbowUp, t.shapes.elbowUp], bridge: [t.bridge, bridgeShape], holder: [t.holder, t.shapes.holder], elbowLow: [t.elbowLow, t.shapes.elbowLow] };
    // the clamp sits to one side of the bridge: it is in front of it or behind it as the nut turns
    const radial = place.rot([0, 1, 0]);
    const tangential = place.rot([0, 0, 1]);
    const clampNearer = -1.2 * G.dot3(radial, V) + 3 * G.dot3(tangential, V) > 0;
    const order = clampNearer ? ["elbowUp", "bridge", "holder", "elbowLow"] : ["holder", "elbowUp", "bridge", "elbowLow"];
    const front = order.filter((key) => t.facing[key] > 0);
    // far enough round the back, a piece is wholly behind the nut's own outline
    const back = order.filter((key) => t.facing[key] <= 0 && t.facing[key] > -0.62);
    return { back: back.map((key) => pieces[key][0]).join(""), a: holes + front.map((key) => pieces[key][0]).join(""), b: "", shapes: { back: back.map((key) => pieces[key][1]), front: front.map((key) => pieces[key][1]) } };
  };
  const A_tube = (points, r, name) => {
    const total = points.reduce((s, p, i) => (i ? s + G.len3(G.sub3(p, points[i - 1])) : 0), 0);
    return { kind: "tube", points, radii: points.map(() => r), round: [false, false], name, owner: name.split(".")[0], total };
  };
  const seamSvg = (d) => (d ? `<path class="iso-line iso-edge pb-seam" data-tone="hi" d="${d}"/>` : "");
  // the cut lower half of the upper bend's mouth, seen once the top has lifted away
  const mouthOf = (c, frame, cap) => {
    const pts = cap.map(([p, q]) => at(G.add3(c, G.add3(G.mul3(frame.u, p), G.mul3(frame.v, q)))));
    return `<g class="pb-seam"><path class="iso-fill" d="${k.pathOf(oriented(pts), true)}"/><path class="iso-shade" data-shade="${G.toneOf([1, 0, 0], P)}" d="${k.pathOf(oriented(pts), true)}"/><path class="iso-line iso-edge" data-tone="hi" d="${k.pathOf(pts, true)}"/></g>`;
  };

  // nut 2's key slot and grease nipple turn with it as it is screwed on or off
  const nut2Turn = (pose) => (2 * Math.PI * pose.back) / D.screw.lead;
  const nut2Features = (N2, pose) => {
    const x0 = N2.body[0] + pose.cx + pose.back;
    const turnBy = nut2Turn(pose);
    let out = "";
    const slotAngle = Math.PI / 2 + turnBy;
    const slotAlpha = G.fadeOf(Math.sin(slotAngle) * V[2] + Math.cos(slotAngle) * V[1], [0.05, 0.35]);
    if (slotAlpha > 0.02) out += `<path class="pb-hole" opacity="${slotAlpha.toFixed(2)}" d="${slotQuad(x0, x0 + 10, slotAngle, 17.75, pose.lift)}"/>`;
    const a = Math.PI / 4 + turnBy;
    const dir = [0, Math.cos(a), Math.sin(a)];
    // the nipple turns out of sight round the back: fade it at the limb instead of popping
    const alpha = G.fadeOf(G.dot3(dir, V), [0.02, 0.3]);
    if (alpha > 0.02) {
      const F = G.frameOf([x0 + D.nipple2, 0, ZA + pose.lift], dir, [1, 0, 0], G.cross3(dir, [1, 0, 0]));
      const c = G.pointOf(F, D.nut.rOut + 3.4, 0, 0);
      out += `<g opacity="${alpha.toFixed(2)}">` + S(G.disc(D.nut.rOut - 0.6, D.nut.rOut + 2.4, 2.2, F, P, { steps: 6 }), { tone: "mid" }) + S(G.sphereOf(c, 1.3, P, { steps: 18 }), { tone: "mid" }) + `</g>`;
    }
    return out;
  };
  const nut2FeatureShapes = (N2, pose, A) => {
    const x0 = N2.body[0] + pose.cx + pose.back;
    const a = Math.PI / 4 + nut2Turn(pose);
    const dir = [0, Math.cos(a), Math.sin(a)];
    const F = G.frameOf([x0 + D.nipple2, 0, ZA + pose.lift], dir, [1, 0, 0], G.cross3(dir, [1, 0, 0]));
    // a nipple faded out round the back is not drawn, so it has no place in the order
    if (G.fadeOf(G.dot3(dir, V), [0.02, 0.3]) <= 0.02) return [];
    return [A.disc(F, D.nut.rOut - 0.6, D.nut.rOut + 2.4, 2.2, { name: "nut2.nipple", owner: "nut" })];
  };

  // handwheel crank and graduated collar, turned by phi
  const handleSvg = (phi) => {
    const y = 22 * Math.cos(phi);
    const z = ZA + 22 * Math.sin(phi);
    const F = G.frameOf([0, y, z], [1, 0, 0], [0, 1, 0], [0, 0, 1]);
    return S(G.disc(166, 178, 3.2, F, P, { steps: 18 }), { tone: "mid" }) + S(G.sphereOf([181.5, y, z], 4.6, P, { steps: 28 }), { tone: "hi" });
  };
  const collarSvg = (phi) => {
    const minor = G.ribsOf(AX, 152.6, 154.4, 15, 100, P, { phase: phi, fade: [0.12, 0.55] });
    const major = G.ribsOf(AX, 152.6, 156.4, 15, 10, P, { phase: phi, fade: [0.12, 0.55] });
    return k.fadedSvg(minor, { tone: "lo" }) + k.fadedSvg(major, { tone: "mid" });
  };

  return { sectorPoly, sectorPaths, flangeHoles, socketAt, keySlot, runSvg, ringSvg, nut2Features, nut2FeatureShapes, handleSvg, collarSvg, nut2Turn, tubeParts, tubeSlots };
}
