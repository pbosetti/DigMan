(() => {
  const q = new URLSearchParams(location.search);
  const theme = q.get("theme") || "light";
  const dark = theme === "dark" || (theme === "auto" && matchMedia("(prefers-color-scheme: dark)").matches);
  const root = document.documentElement;
  if (dark) root.removeAttribute("data-theme");
  else root.setAttribute("data-theme", "light");
  // a cleared background: a colour scheme unlike the parent page's would make the
  // browser paint an opaque canvas behind the iframe, so leave it at the default
  if (q.get("bg") === "none") root.classList.add("sl-clear");
  const fit = () => root.style.setProperty("--sl-scale", String(Math.min(innerWidth / 1280, innerHeight / 720)));
  fit();
  addEventListener("resize", fit);
  if (window.parent === window) return;
  // inside a deck: hand the navigation keys to it
  const NAV = { ArrowRight: "next", ArrowDown: "next", PageDown: "next", " ": "next", n: "next", ArrowLeft: "prev", ArrowUp: "prev", PageUp: "prev", Backspace: "prev", p: "prev", Escape: "toggleOverview", o: "toggleOverview", b: "togglePause", ".": "togglePause" };
  addEventListener("keydown", (event) => {
    if (event.metaKey || event.ctrlKey || event.altKey) return;
    const method = NAV[event.shiftKey && event.key === " " ? "ArrowLeft" : event.key];
    if (!method) return;
    event.preventDefault();
    event.stopPropagation();
    window.parent.postMessage(JSON.stringify({ method, args: [] }), "*");
  }, true);
})();

"iso-swatch-crease" d="M2 4.5 8 7.5 14 4.5"/></svg>Kinematic seat: three rods on six balls, wired in series</span><span class="iso-key"><svg class="iso-swatch" data-mark="edge" viewBox="0 0 16 10" aria-hidden="true"><path d="M1.5 5h13"/></svg>Block on a micrometer slide, 0.01 mm a division</span></span><div class="sl-controls"><button class="sl-button" type="button" id="pr-open" data-action="open">Open the probe</button><button class="sl-button" type="button" id="pr-push" data-action="push">Push the stylus</button></div></figcaption></figure></main><script type="module">const AZIMUTH = 45;
const ELEVATION = 30;
const SHADES = 4;
const RADIANS = Math.PI / 180;
const UNIT = Math.sqrt(1.6);
function cameraOf({ scale, azimuth = AZIMUTH, elevation = ELEVATION }) {
    const a = azimuth * RADIANS;
    const e = elevation * RADIANS;

function iso([x, y, z], projection) {
    const { origin } = projection;

    return [origin[0] + (x * sinA - y * cosA) * k, origin[1] + ((x * cosA + y * sinA) * sinE - z * cosE) * k];

    const { sinA, cosA } = cameraOf(projection);
    return [cosA, sinA];
}
function depthOf([x, y, z], projection) {
    const { sinA, cosA, sinE, cosE } = cameraOf(projection);
    return (x * cosA + y * sinA) * cosE + z * sinE;

const tenth = (value) => {
    const text = (Math.round(value * 10) / 10).toFixed(1).replace(/\.0$/, "");
    return text === "-0" ? "0" : text;
};
function pathOf(points, closed = false) {
    if (!points.length)
        return "";
    return points.map(([x, y], at) => `${at ? "L" : "M"}${tenth(x)} ${tenth(y)}`).join("") + (closed ? "Z" : "");

function roundedPlan({ x, y, w, d, r }, steps = 8) {
    const radius = Math.max(0, Math.min(r, w / 2, d / 2));
    const corners = [
        [x + w - radius, y + radius, -90],
        [x + w - radius, y + d - radius, 0],
        [x + radius, y + d - radius, 90],
        [x + radius, y + radius, 180],
    ];
    const out = [];
    for (const [cx, cy, start] of corners) {
        const count = radius > 0 ? steps : 0;
        for (let step = 0; step <= count; step++) {
            const angle = (start + (count ? (90 * step) / count : 45)) * RADIANS;

}

function convexHull(points) {
    const sorted = [...points].sort((a, b) => a[0] - b[0] || a[1] - b[1]);
    if (sorted.length < 3)
        return sorted;
    const cross = (o, a, b) => (a[0] - o[0]) * (b[1] - o[1]) - (a[1] - o[1]) * (b[0] - o[0]);
    const lower = [];
    for (const point of sorted) {
        while (lower.length >= 2 && cross(lower[lower.length - 2], lower[lower.length - 1], point) <= 0)

        lower.push(point);
    }
    const upper = [];
    for (let index = sorted.length - 1; index >= 0; index--) {

        upper.push(point);

function runsOf(flags, want) {
    const count = flags.length;

            const mx = ax + bx;

        });

function surfaceOf(side, F, P, rims, { samples = 96, slope = null } = {}) {

const softOf = (meridian) => meridian.some((point) => Boolean(point[2]));

function lathe(meridian, F, P, { steps = stepsFor(Math.max(...meridian.map(([, r]) => r)), 32, 160, scaleOf(P)), fill = "auto", hole = null, bevel = 0, rims = "all", smooth: asked = "auto", waist = 0.5 } = {}) {

const signedArea = (points) => points.reduce((sum, [x, y], index) => {

const saddleStart = (R, a, angle) => Math.sqrt(Math.max(0, R * R - a * a * Math.cos(angle) ** 2));
